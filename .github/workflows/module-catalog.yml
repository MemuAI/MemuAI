name: Module catalogue integrity
on:
  pull_request:
    paths:
      - 'module-catalog/**'
      - 'app/module_catalog*'
      - 'tools/check_module_catalog.py'
      - '.github/workflows/module-catalog.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install httpx
      - run: python tools/check_module_catalog.py
