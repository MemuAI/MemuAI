<div class="mc" id="app">
  <header class="mc-bar">
    <div class="mc-brand">
      <span class="mc-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </span>
      <div class="mc-brand-text">
        <b data-i18n="title"></b>
        <span class="mc-status" id="status" role="status" aria-live="polite"></span>
      </div>
    </div>
    <label class="mc-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="search.placeholder" data-i18n-aria-label="search.placeholder">
    </label>
    <select class="mc-select" id="sort" data-i18n-aria-label="sort.label"></select>
    <button type="button" class="mc-btn ghost mc-filter-toggle" id="filters-toggle" aria-controls="filters" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg><span data-i18n="filters.title"></span></button>
    <label class="mc-toggle" data-i18n-title="mine.title">
      <input type="checkbox" id="mine">
      <span class="mc-switch" aria-hidden="true"><i></i></span>
      <span data-i18n="mine"></span>
    </label>
    <button type="button" class="mc-btn" id="refresh" data-i18n-title="refresh.title">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      <span data-i18n="refresh"></span>
    </button>
  </header>
  <div class="mc-body">
    <aside class="mc-filters" id="filters" data-i18n-aria-label="filters.aria"></aside>
    <main class="mc-main" id="main" tabindex="-1"></main>
  </div>
  <div class="mc-compare-bar" id="compare-bar" hidden></div>
  <div class="mc-scrim" id="scrim" hidden></div>
  <aside class="mc-card" id="card" hidden role="dialog" aria-modal="true" data-i18n-aria-label="card.aria"></aside>
</div>
