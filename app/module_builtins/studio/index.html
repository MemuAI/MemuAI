            <header><span class="st-music-emblem"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13M9 9l12-2"/><ellipse cx="6" cy="18" rx="3" ry="3"/><ellipse cx="18" cy="16" rx="3" ry="3"/></svg></span><div><small>MEMUAI STUDIO</small><h2 data-music-label="workshop"></h2></div></header>
            <label class="st-field"><span class="st-label" data-music-label="brief"></span><textarea class="st-prompt" id="music-prompt" rows="4" maxlength="12000" data-music-placeholder="prompt_hint"></textarea></label>
            <div class="st-music-suggestions" id="music-suggestions"></div>
            <div class="st-row st-music-actions"><button type="button" class="mu-btn ghost small" data-open-side data-music-label="params"></button><span class="st-grow"></span><button type="button" class="mu-btn primary st-go" id="music-go" title="Ctrl + Enter"><svg viewBox="0 0 24 24"><path d="m9 5 11 7-11 7z"/></svg><span data-music-label="create"></span></button></div>
            <div class="st-music-progress" id="music-progress" hidden><span></span><p id="music-progress-text" role="status" aria-live="polite"></p></div>
          </section>
          <header class="st-music-library-head"><h3 data-music-label="library"></h3><span class="st-hint" id="music-library-count"></span></header>
          <section class="st-music-results" id="music-results"></section>
        </div>
        <section class="st-music-producer">

          <label class="st-field"><span class="st-label" data-music-label="producer_model"></span><select class="mu-select" id="music-producer-model"></select></label>
          <div class="st-music-chat" id="music-producer-chat" role="log" aria-live="polite"></div>
          <form class="st-music-producer-form" id="music-producer-form">
            <textarea class="mu-textarea" id="music-producer-input" rows="2" maxlength="12000" data-music-placeholder="producer_hint"></textarea>
            <div class="st-row"><button type="button" class="mu-btn ghost small" id="music-producer-apply" hidden data-music-label="apply_draft"></button><span class="st-grow"></span><button type="submit" class="mu-btn small" id="music-producer-send" data-music-label="send"></button></div>
          </form>
        </section>
      </div>
    </div>

  <div class="st-backdrop" data-close-side></div>
