<div class="ml" id="app" data-view="home">
  <aside class="ml-side" aria-label="MemuLearn">

    <nav class="ml-nav">

    <div class="ml-courses" id="side-courses"></div>
    <button type="button" class="ml-new" data-go="create"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="course.new"></span></button>
  </aside>

  <main class="ml-main" id="main" tabindex="-1"></main>

  <div class="ml-toast" id="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="file-doc" accept=".pdf,.docx,.epub,.txt,.md,.markdown,.html,.htm,.rtf,.odt" hidden>
  <input type="file" id="file-import" accept=".apkg,.csv,.tsv,.txt" hidden>
</div>
