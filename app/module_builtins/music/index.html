<div class="mm" id="app" data-view="home">
  <canvas class="mm-ambient" id="ambient" aria-hidden="true"></canvas>
  <img class="mm-coverbg" id="coverbg" alt="" aria-hidden="true">
  <div class="mm-dragzone" data-memu-drag aria-hidden="true"></div>
  <div class="mm-grain" aria-hidden="true"></div>

  <aside class="mm-side" id="side">
    <div class="mm-brand">
      <span class="mm-logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <b>Memu<span>Music</span></b>
    </div>
    <nav class="mm-nav" id="nav" data-i18n-aria-label="nav.aria">
      <button type="button" data-go="home"><svg><use href="#i-home"/></svg><span data-i18n="nav.home"></span></button>
      <button type="button" data-go="library"><svg><use href="#i-library"/></svg><span data-i18n="nav.library"></span></button>
      <button type="button" data-go="playlists"><svg><use href="#i-playlist"/></svg><span data-i18n="nav.playlists"></span></button>
      <button type="button" data-go="download"><svg><use href="#i-download"/></svg><span data-i18n="nav.download"></span><em class="mm-badge" id="jobs-badge" hidden></em></button>
      <button type="button" data-go="stats"><svg><use href="#i-stats"/></svg><span data-i18n="nav.stats"></span></button>
      <button type="button" data-go="settings"><svg><use href="#i-settings"/></svg><span data-i18n="nav.settings"></span></button>
    </nav>
    <div class="mm-side-head"><span data-i18n="nav.your_playlists"></span><button type="button" class="mm-icon sm" id="side-new-playlist" data-i18n-title="playlist.new" data-i18n-aria-label="playlist.new"><svg><use href="#i-plus"/></svg></button></div>
    <div class="mm-side-list" id="side-playlists"></div>
  </aside>

  <main class="mm-main" id="main">
    <div class="mm-view" id="view"></div>
  </main>

  <footer class="mm-bar" id="bar">
    <div class="mm-bar-track">
      <button type="button" class="mm-bar-cover" id="bar-cover" data-i18n-title="np.open" data-i18n-aria-label="np.open"><img alt="" id="bar-img"><svg class="mm-bar-expand"><use href="#i-expand"/></svg></button>
      <div class="mm-bar-meta">
        <b id="bar-title" data-i18n="player.idle"></b>
        <span id="bar-artist" data-i18n="player.idle_hint"></span>
      </div>
      <button type="button" class="mm-icon mm-like" id="bar-like" data-i18n-title="like" data-i18n-aria-label="like"><svg><use href="#i-heart"/></svg></button>
    </div>
    <div class="mm-bar-center">
      <div class="mm-transport">
        <button type="button" class="mm-icon" id="shuffle" data-i18n-title="shuffle" data-i18n-aria-label="shuffle"><svg><use href="#i-shuffle"/></svg></button>
        <button type="button" class="mm-icon" id="prev" data-i18n-title="prev" data-i18n-aria-label="prev"><svg><use href="#i-prev"/></svg></button>
        <button type="button" class="mm-play" id="play" data-i18n-title="play" data-i18n-aria-label="play"><svg><use href="#i-play"/></svg></button>
        <button type="button" class="mm-icon" id="next" data-i18n-title="next" data-i18n-aria-label="next"><svg><use href="#i-next"/></svg></button>
        <button type="button" class="mm-icon" id="repeat" data-i18n-title="repeat" data-i18n-aria-label="repeat"><svg><use href="#i-repeat"/></svg></button>
      </div>
      <div class="mm-seek-row">
        <span class="mm-time" id="t-cur">0:00</span>
        <div class="mm-seek" id="seek" role="slider" tabindex="0" data-i18n-aria-label="seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i class="mm-seek-buf"></i><i class="mm-seek-fill"></i><i class="mm-seek-knob"></i></div>
        <span class="mm-time" id="t-dur">0:00</span>
      </div>
    </div>
    <div class="mm-bar-tools">
      <button type="button" class="mm-icon" id="open-lyrics" data-i18n-title="lyrics.title" data-i18n-aria-label="lyrics.title"><svg><use href="#i-lyrics"/></svg></button>
      <button type="button" class="mm-icon" id="open-queue" data-i18n-title="queue.title" data-i18n-aria-label="queue.title"><svg><use href="#i-queue"/></svg></button>
      <button type="button" class="mm-icon" id="open-eq" data-i18n-title="eq.title" data-i18n-aria-label="eq.title"><svg><use href="#i-eq"/></svg></button>
      <button type="button" class="mm-icon" id="mute" data-i18n-title="mute" data-i18n-aria-label="mute"><svg><use href="#i-volume"/></svg></button>
      <input type="range" class="mm-range" id="volume" min="0" max="1" step="0.01" value="0.8" data-i18n-aria-label="volume">
    </div>
  </footer>

  <section class="mm-np" id="np" hidden data-i18n-aria-label="np.title">
    <canvas class="mm-np-bg" id="np-bg" aria-hidden="true"></canvas>
    <img class="mm-np-blur" id="np-blur" alt="" aria-hidden="true">
    <img class="mm-np-backdrop" id="np-backdrop" alt="" aria-hidden="true">
    <div class="mm-np-shade" aria-hidden="true"></div>
    <div class="mm-dragzone" data-memu-drag aria-hidden="true"></div>
    <header class="mm-np-head">
      <button type="button" class="mm-icon glass" id="np-close" data-i18n-title="np.close" data-i18n-aria-label="np.close"><svg><use href="#i-down"/></svg></button>
      <div class="mm-np-from"><span data-i18n="np.playing_from"></span><b id="np-from"></b></div>
      <div class="mm-seg glass" id="np-style" role="radiogroup">
        <button type="button" data-style="card" role="radio" data-i18n-title="np.style_card" data-i18n-aria-label="np.style_card"><svg><use href="#i-card"/></svg></button>
        <button type="button" data-style="vinyl" role="radio" data-i18n-title="np.style_vinyl" data-i18n-aria-label="np.style_vinyl"><svg><use href="#i-disc"/></svg></button>
        <button type="button" data-style="full" role="radio" data-i18n-title="ui.np.full" data-i18n-aria-label="ui.np.full"><svg><use href="#i-full"/></svg></button>
        <button type="button" data-style="minimal" role="radio" data-i18n-title="ui.np.minimal" data-i18n-aria-label="ui.np.minimal"><svg><use href="#i-minimal"/></svg></button>
      </div>
    </header>
    <div class="mm-np-body">
      <div class="mm-np-stage" id="np-stage">
        <div class="mm-np-art" id="np-art">
          <div class="mm-vinyl" aria-hidden="true"><div class="mm-vinyl-disc"><div class="mm-vinyl-label"><img alt="" id="np-label"></div></div></div>
          <div class="mm-np-cover"><img alt="" id="np-img"><i class="mm-glare"></i></div>
        </div>
        <canvas class="mm-viz" id="viz" aria-hidden="true"></canvas>
      </div>
      <div class="mm-np-side">
        <div class="mm-np-meta">
          <div class="mm-np-titles"><h1 id="np-title"></h1><p id="np-artist"></p></div>
          <button type="button" class="mm-icon lg mm-like" id="np-like" data-i18n-title="like" data-i18n-aria-label="like"><svg><use href="#i-heart"/></svg></button>
        </div>
        <div class="mm-np-tabs" role="tablist">
          <button type="button" role="tab" data-tab="lyrics"><svg><use href="#i-lyrics"/></svg><span data-i18n="lyrics.title"></span></button>
          <button type="button" role="tab" data-tab="queue"><svg><use href="#i-queue"/></svg><span data-i18n="queue.up_next"></span></button>
          <i class="mm-np-tabs-pill" aria-hidden="true"></i>
        </div>
        <div class="mm-lyrics" id="lyrics"><div class="mm-lyrics-inner" id="lyrics-inner"></div></div>
        <div class="mm-ly-bar" id="ly-bar" hidden></div><!-- r39-music-lyrics: источник/варианты, смещение -->
        <div class="mm-np-queue" id="np-queue" hidden></div>
        <div class="mm-np-controls">
          <div class="mm-seek-row">
            <span class="mm-time" id="np-cur">0:00</span>
            <div class="mm-seek big" id="np-seek" role="slider" tabindex="0" data-i18n-aria-label="seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i class="mm-seek-buf"></i><i class="mm-seek-fill"></i><i class="mm-seek-knob"></i></div>
            <span class="mm-time" id="np-dur">0:00</span>
          </div>
          <div class="mm-transport big">
            <button type="button" class="mm-icon" data-act="shuffle" data-i18n-title="shuffle" data-i18n-aria-label="shuffle"><svg><use href="#i-shuffle"/></svg></button>
            <button type="button" class="mm-icon lg" data-act="prev" data-i18n-title="prev" data-i18n-aria-label="prev"><svg><use href="#i-prev"/></svg></button>
            <button type="button" class="mm-play xl" data-act="play" data-i18n-title="play" data-i18n-aria-label="play"><svg><use href="#i-play"/></svg></button>
            <button type="button" class="mm-icon lg" data-act="next" data-i18n-title="next" data-i18n-aria-label="next"><svg><use href="#i-next"/></svg></button>
            <button type="button" class="mm-icon" data-act="repeat" data-i18n-title="repeat" data-i18n-aria-label="repeat"><svg><use href="#i-repeat"/></svg></button>
          </div>
          <div class="mm-np-tools">
            <button type="button" class="mm-chip glass" data-pop="speed"><svg><use href="#i-speed"/></svg><span id="speed-label">1×</span></button>
            <button type="button" class="mm-chip glass" data-pop="sleep"><svg><use href="#i-moon"/></svg><span id="sleep-label" data-i18n="sleep.off"></span></button>
            <button type="button" class="mm-chip glass" data-pop="eq" data-i18n-title="eq.title" data-i18n-aria-label="eq.title"><svg><use href="#i-eq"/></svg><span id="eq-label" data-i18n="eq.preset.flat"></span></button>
            <button type="button" class="mm-chip glass" id="np-viz-toggle" aria-pressed="true" data-i18n-title="viz.title" data-i18n-aria-label="viz.title"><svg><use href="#i-wave"/></svg><span data-i18n="viz.title"></span></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <aside class="mm-drawer" id="queue-drawer" hidden data-i18n-aria-label="queue.title">
    <header><b data-i18n="queue.title"></b><span class="mm-grow"></span><button type="button" class="mm-btn ghost sm" id="queue-clear" data-i18n="queue.clear"></button><button type="button" class="mm-icon" data-close="queue-drawer" data-i18n-aria-label="close"><svg><use href="#i-close"/></svg></button></header>
    <div class="mm-drawer-body" id="queue-list"></div>
  </aside>

  <div class="mm-pop" id="pop" hidden role="dialog"></div>
  <div class="mm-menu" id="menu" hidden role="menu"></div>
  <div class="mm-modal" id="modal" hidden><div class="mm-modal-card" id="modal-card" role="dialog" aria-modal="true"></div></div>
  <div class="mm-drop" id="drop" hidden><div class="mm-drop-card"><span class="mm-drop-ico" aria-hidden="true"><svg class="l"><use href="#i-link"/></svg><svg class="f"><use href="#i-folder"/></svg></span><b class="l" data-i18n="drop.title"></b><span class="l" data-i18n="drop.hint"></span><b class="f" data-i18n="drop.files_title"></b><span class="f" data-i18n="drop.files_hint"></span></div></div>
  <div class="mm-toasts" id="toasts" role="status" aria-live="polite"></div>
  <audio id="deck-a" preload="auto" crossorigin="anonymous"></audio>
  <audio id="deck-b" preload="auto" crossorigin="anonymous"></audio>
</div>
