<div class="mu-page mu-col notes">
  <div class="mu-toolbar">
    <input class="mu-input notes-search" id="search" type="search" data-i18n-placeholder="search" data-i18n-aria-label="search">
    <button class="mu-btn primary" id="add" data-i18n="add"></button>
  </div>
  <div class="notes-body">
    <div class="mu-scroll notes-list" id="list" role="listbox" data-i18n-aria-label="list"></div>
    <div class="mu-card notes-editor">
      <input class="mu-input" id="title" data-i18n-placeholder="title" data-i18n-aria-label="title">
      <textarea class="mu-textarea" id="text" data-i18n-placeholder="text" data-i18n-aria-label="text"></textarea>
      <div class="mu-row">
        <span class="mu-muted" id="status" aria-live="polite"></span>
        <span class="mu-grow"></span>
        <button class="mu-btn ghost small" id="copy" data-i18n="copy"></button>
        <button class="mu-btn ghost small" id="export" data-i18n="export"></button>
        <button class="mu-btn danger small" id="remove" data-i18n="remove"></button>
      </div>
    </div>
  </div>
</div>
