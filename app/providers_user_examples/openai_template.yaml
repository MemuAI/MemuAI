# Шаблон декларативного плагина: любой OpenAI-совместимый API без кода.
#
# Как пользоваться:
#   1. В админке Proxy (вкладка «Аккаунты» → «Плагины провайдеров» →
#      «Из шаблона») создайте плагин из этого шаблона и задайте свой id.
#   2. Или скопируйте файл в папку плагинов (%APPDATA%\MemuAI\providers)
#      и поправьте поля ниже, затем нажмите «Обновить плагины».
#   3. Добавьте аккаунт нового провайдера на вкладке «Аккаунты» — нужен
#      только API-ключ. Модели появятся в /v1/models с префиксом id.
#
# Поля:
#   id       — латиница в нижнем регистре, цифры, дефис; не занят встроенными
#   kind     — openai-chat (обычный /chat/completions) или openai-responses
#   base_url — адрес API без пути чата (путь — в chat_path, если нестандартный)
#   auth     — bearer (Authorization: Bearer <ключ>), header (свой заголовок)
#              или none (без ключа)
#   models   — стартовый список моделей; живой список подтянется сам, если
#              endpoint отдаёт /models
plugin_api: 1
id: my-api
title: Мой API
description: OpenAI-совместимый сервис
kind: openai-chat
base_url: https://api.example.com/v1
auth: bearer
models:
  - model-a
  - model-b
